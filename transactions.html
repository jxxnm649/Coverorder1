<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Transactions</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="transactions.css">
</head>
<body class="bf-has-nav">

  <div class="container">

    <h1>My Transactions 🧾</h1>

    <!-- Balance summary -->
    <div class="txn-balance-card">
      <div class="txn-balance-label">Current Balance</div>
      <div class="txn-balance-amount" id="currentBalance">₹0</div>
      <div class="txn-balance-sub">
        <span class="txn-in">↓ In: <b id="totalIn">₹0</b></span>
        <span class="txn-out">↑ Out: <b id="totalOut">₹0</b></span>
      </div>
    </div>

    <!-- Pending cashback — not usable/withdrawable yet -->
    <div class="txn-balance-card" id="pendingCashbackCard" style="display:none;background:#FFF6E6;border:1px dashed #D98925;">
      <div class="txn-balance-label">⏳ Pending Cashback</div>
      <div class="txn-balance-amount" id="pendingCashbackAmount" style="color:#D98925;">₹0</div>
      <div class="txn-balance-sub" style="opacity:.75;">
        Moves to your usable balance once those orders are delivered.
      </div>
    </div>

    <a href="withdraw.html" style="text-decoration:none;">
      <button type="button" class="bf-btn bf-btn-primary bf-btn-block" style="margin-bottom:18px;">💸 Withdraw Funds</button>
    </a>

    <!-- Search + Filters trigger -->
    <div class="txn-search-row">
      <div class="txn-search-box">
        <span>🔍</span>
        <input type="text" id="txnSearch" placeholder="Search by reason...">
      </div>
      <button type="button" id="openFiltersBtn" class="txn-filters-btn">☰ Filters</button>
    </div>

    <!-- Bottom-sheet filter modal -->
    <div class="txn-filter-overlay" id="filterOverlay">
      <div class="txn-filter-sheet">

        <div class="txn-filter-header">
          <h3>FILTER BY</h3>
          <button type="button" id="closeFiltersBtn" class="txn-filter-close">✕</button>
        </div>

        <div class="txn-filter-body">

          <h4>Type</h4>

          <label class="txn-filter-radio-row">
            <input type="radio" name="txnTypeFilter" value="all" checked>
            <span class="txn-radio-circle"></span>
            All
          </label>
          <label class="txn-filter-radio-row">
            <input type="radio" name="txnTypeFilter" value="credit">
            <span class="txn-radio-circle"></span>
            Credit (In)
          </label>
          <label class="txn-filter-radio-row">
            <input type="radio" name="txnTypeFilter" value="debit">
            <span class="txn-radio-circle"></span>
            Debit (Out)
          </label>

          <h4 style="margin-top:22px;">Date Range</h4>

          <div class="txn-date-row">
            <div class="txn-field">
              <label>From</label>
              <input type="date" id="fromDate">
            </div>
            <div class="txn-field">
              <label>To</label>
              <input type="date" id="toDate">
            </div>
          </div>

        </div>

        <div class="txn-filter-actions">
          <button type="button" id="clearFilters" class="txn-clear-btn">Clear</button>
          <button type="button" id="applyFiltersBtn" class="txn-apply-btn">Apply</button>
        </div>

      </div>
    </div>

    <!-- List -->
    <div id="txnList"></div>

  </div>

  <nav class="bottom-nav">
    <a href="home.html"><span>🏠</span><p>Home</p></a>
    <a href="wishlist.html"><span>😊</span><p>Liked</p></a>
    <a href="orders.html"><span>📦</span><p>Orders</p></a>
    <a href="profile.html"><span>🏪</span><p>My Account</p></a>
  </nav>

  <script type="module" src="transactions.js"></script>
  <script type="module" src="profile-menu.js"></script>

</body>
</html>

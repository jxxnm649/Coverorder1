<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Placed</title>

<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="payment-status.css">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
  .scratch-card-section {
    background: linear-gradient(135deg, #fff2e6 0%, #ffe3cc 100%);
    border: 2px dashed #ff6f00; border-radius: 12px; padding: 14px; margin: 18px auto 0; max-width: 340px; text-align: left;
  }
  .scratch-card-title { font-size: 13px; font-weight: 700; color: #d85c00; margin-bottom: 8px; }
  .scratch-card-box { width: 100%; height: 90px; background: #2c3e50; border-radius: 10px; position: relative; overflow: hidden; cursor: pointer; }
  .scratch-reward-content { width: 100%; height: 100%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .scratch-reward-content .amount { font-size: 24px; font-weight: 900; color: #27ae60; }
  .scratch-reward-content .reward-sub { font-size: 11px; color: #555; font-weight: 600; }
  .scratch-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg, #b8860b 0%, #ffd700 50%, #b8860b 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font-weight: bold; font-size: 13px; text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    transition: opacity 0.4s ease; border-radius: 10px;
  }
  .scratch-overlay.scratched { opacity: 0; pointer-events: none; }
  .scratch-note { font-size: 11.5px; color: #666; margin-top: 8px; }
</style>

</head>
<body>

<div class="status-card success-card">
  <div class="status-icon">✅</div>
  <h1>Order Placed!</h1>
  <p id="statusMsg">Your order has been placed successfully.</p>
  <p class="order-id" id="orderIdText"></p>

  <div class="scratch-card-section" id="scratchSection" style="display:none;">
    <div class="scratch-card-title">🎁 Scratch to reveal your cashback!</div>
    <div class="scratch-card-box" id="scratchBox">
      <div class="scratch-reward-content">
        <div class="amount" id="cashbackAmountText">₹0</div>
        <div class="reward-sub">Cashback Reward</div>
      </div>
      <div class="scratch-overlay" id="scratchOverlay">
        <span>✨ Tap to Scratch ✨</span>
      </div>
    </div>
    <div class="scratch-note">Credited to your wallet once this order is delivered.</div>
  </div>

  <button onclick="window.location.href='orders.html'">View My Orders</button>
  <button class="ghost" onclick="window.location.href='home.html'">Continue Shopping</button>
</div>

<script type="module">
  import { db } from "./firebase.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

  const params = new URLSearchParams(window.location.search);
  const orderId = params.get("orderId");
  const method = params.get("method");

  if (orderId) {
    document.getElementById("orderIdText").textContent = "Order ID: " + orderId;
  }

  if (method === "cod") {
    document.getElementById("statusMsg").textContent =
      "Your order has been placed. Pay cash when it arrives 💵";
  }

  // Fire a small celebration regardless — real order was actually placed.
  try {
    if (typeof confetti === "function") {
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    }
  } catch (e) {}

  // Show the scratch card only if this real order actually has a
  // pending cashback amount attached (set by checkout.js).
  async function loadCashback() {
    if (!orderId) return;

    try {
      const snap = await getDoc(doc(db, "orders", orderId));
      if (!snap.exists()) return;

      const order = snap.data();
      if (!order.cashbackAmount || order.cashbackStatus !== "pending") return;

      document.getElementById("cashbackAmountText").textContent = `₹${order.cashbackAmount}`;
      document.getElementById("scratchSection").style.display = "block";

    } catch (error) {
      console.log(error);
    }
  }

  document.getElementById("scratchBox").addEventListener("click", () => {
    const overlay = document.getElementById("scratchOverlay");
    if (overlay.classList.contains("scratched")) return;

    overlay.classList.add("scratched");

    try {
      if (typeof confetti === "function") {
        confetti({ particleCount: 60, spread: 60, origin: { y: 0.7 } });
      }
    } catch (e) {}
  });

  loadCashback();
</script>

</body>
</html>
